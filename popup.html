<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>AutoClean MultiOne</title>

<style>
  * { box-sizing: border-box; }

  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #0f2a44, #061826 70%);
    color: #eaf4ff;
  }

  .card {
    background: rgba(12, 32, 52, 0.92);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    border: 1px solid rgba(80,160,255,0.18);
  }

  .title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-size: 18px;
    font-weight: 600;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4da3ff;
    box-shadow: 0 0 8px #4da3ff;
  }

  label {
    font-size: 12px;
    color: #9fc9ff;
    margin-bottom: 4px;
    display: block;
  }

  input {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 10px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.15);
    background: #0b2236;
    color: white;
    font-size: 13px;
    outline: none;
  }

  input:focus {
    border-color: #4da3ff;
    box-shadow: 0 0 0 1px rgba(77,163,255,0.4);
  }

  .switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0;
  }

  .status {
    font-size: 12px;
    color: #7fa7d6;
  }

  .switch {
    position: relative;
    width: 44px;
    height: 24px;
  }

  .switch input {
    display: none;
  }

  .slider {
    position: absolute;
    inset: 0;
    background: #12324f;
    border-radius: 24px;
    cursor: pointer;
    transition: 0.3s;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }

  .switch input:checked + .slider {
    background: #4da3ff;
  }

  .switch input:checked + .slider::before {
    transform: translateX(20px);
  }

  button {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border-radius: 9px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #1f7aff, #4da3ff);
    cursor: pointer;
  }

  button:active {
    transform: scale(0.98);
  }

  .footer {
    margin-top: 10px;
    font-size: 11px;
    color: #7fa7d6;
    text-align: center;
  }
</style>
</head>

<body>
  <div class="card">
    <div class="title">
      <div class="dot"></div>
      AutoClean MultiOne
    </div>

    <label>Email</label>
    <input id="user" placeholder="usuario@empresa.com">

    <label>Senha</label>
    <input id="pass" type="password" placeholder="••••••••">

    <label>Intervalo (min)</label>
    <input id="interval" type="number" min="1">

    <div class="switch-row">
      <div class="status" id="status">Automação desligada</div>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>

    <button id="save">Salvar</button>

    <div class="footer" id="lastRun">
      Última execução: —
    </div>
  </div>

<script src="popup.js"></script>
</body>
</html>
